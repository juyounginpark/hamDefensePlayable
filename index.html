<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Unity Web Player | hamdefense</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231f20;
      }

      #unity-canvas {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 1920px;
        height: 1080px;
        background: #231f20;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
    <script src="Build/HamDefense.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function fitRotatedCanvas() {
        // After a 90-degree turn, the visible bounds are 1080 x 1920.
        var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
        canvas.style.transform =
          "translate(-50%, -50%) rotate(-90deg) scale(" + scale + ")";
      }

      fitRotatedCanvas();
      window.addEventListener("resize", fitRotatedCanvas);
      window.addEventListener("orientationchange", fitRotatedCanvas);

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/HamDefense.data",
        frameworkUrl: "Build/HamDefense.framework.js",
        codeUrl: "Build/HamDefense.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "hamdefense",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
