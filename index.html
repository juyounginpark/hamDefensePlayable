<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Unity Web Player | hamdefense</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231f20;
      }

      #unity-canvas {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        transform: translate(-50%, -50%);
        background: #231f20;
      }

      #orientation-guide {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        color: white;
        background: #231f20;
        font-family: sans-serif;
        text-align: center;
      }

      #landscape-button {
        padding: 14px 22px;
        border: 0;
        border-radius: 10px;
        color: #231f20;
        background: white;
        font-size: 16px;
        font-weight: 700;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #orientation-guide {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <div id="orientation-guide" role="dialog" aria-live="polite">
      <div>게임은 가로 화면에 최적화되어 있습니다.<br>기기를 가로로 돌려 주세요.</div>
      <button id="landscape-button" type="button">가로 화면으로 시작</button>
    </div>
    <script src="Build/HamDefense.loader.js"></script>
    <script>
      async function enterLandscape() {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (error) {
          console.warn("Fullscreen request was rejected:", error);
        }

        try {
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape");
          }
        } catch (error) {
          console.warn("Landscape lock is not supported by this browser:", error);
        }
      }

      document.querySelector("#landscape-button").addEventListener("click", enterLandscape);

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/HamDefense.data",
        frameworkUrl: "Build/HamDefense.framework.js",
        codeUrl: "Build/HamDefense.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "hamdefense",
        productVersion: "0.1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
