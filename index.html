<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>HamDefense</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231f20;
      }

      #game-frame {
        position: fixed;
        top: 50%;
        left: 50%;
        display: block;
        width: min(100vh, calc(100vw * 16 / 9));
        height: min(100vw, calc(100vh * 9 / 16));
        border: 0;
        transform: translate(-50%, -50%) rotate(-90deg);
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <iframe
      id="game-frame"
      src="game.html?v=audio-fix-1"
      title="HamDefense"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        if (!/KAKAOTALK/i.test(ua)) return;

        var url = location.href.split("#")[0];
        var isAndroid = /Android/i.test(ua);
        var externalUrl = isAndroid
          ? "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;action=android.intent.action.VIEW;end"
          : url;
        var notice = document.createElement("div");
        notice.style.cssText = "position:fixed;z-index:10;inset:0 0 auto 0;padding:12px;background:#111;color:#fff;text-align:center;font:14px sans-serif";
        notice.innerHTML = "카카오톡 브라우저에서는 소리가 제한될 수 있습니다. <a href=\"" + externalUrl + "\" target=\"_blank\" rel=\"noopener\" style=\"color:#8fd3ff\">외부 브라우저로 열기</a>";
        document.body.appendChild(notice);
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("ServiceWorker.js?v=audio-fix-2").then(function (registration) {
          registration.update();
        });
      }
    </script>
  </body>
</html>
