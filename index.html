<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>HamDefense</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171315; }
      button { font: inherit; }

      #launcher {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        overflow-y: auto;
        background: radial-gradient(circle at 50% 10%, rgba(255, 181, 71, 0.18), transparent 40%), #171315;
      }

      .panel { width: min(720px, calc(100vw - 40px)); text-align: center; }
      h1 { margin: 0; color: #ffb547; font-size: clamp(32px, 7vw, 52px); letter-spacing: -0.04em; }
      h2 { margin: 12px 0 24px; font-size: clamp(19px, 4vw, 25px); }
      .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

      .choice {
        min-height: 150px;
        border: 2px solid #4a3e42;
        border-radius: 18px;
        padding: 20px 14px;
        color: #fff;
        background: #282124;
        cursor: pointer;
        transition: border-color 150ms, background 150ms, transform 150ms;
      }

      .choice:hover, .choice:focus-visible {
        border-color: #ffb547;
        background: #33282c;
        outline: none;
        transform: translateY(-2px);
      }

      .choice-icon { display: block; margin-bottom: 12px; font-size: 46px; line-height: 1; }
      .choice-title { display: block; font-size: 20px; font-weight: 800; }
      .choice-note { display: block; margin-top: 6px; color: #cbbfc3; font-size: 14px; }
      #mobile-step[hidden], #launcher[hidden] { display: none; }
      .orientation-choice { min-height: 280px; }

      .phone-preview {
        position: relative;
        display: block;
        width: 104px;
        height: 190px;
        margin: 0 auto 14px;
        border: 6px solid #d9cdd1;
        border-radius: 22px;
        background: #0e0c0d;
      }

      .phone-preview::before {
        content: "";
        position: absolute;
        z-index: 1;
        top: 5px;
        left: 50%;
        width: 30px;
        height: 5px;
        border-radius: 5px;
        background: #d9cdd1;
        transform: translateX(-50%);
      }

      .preview-game {
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        width: 156px;
        height: 86px;
        border-radius: 5px;
        color: #3a2308;
        background: linear-gradient(135deg, #ffce65, #f28c35);
        font-size: 15px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .rotate-left .preview-game { transform: translate(-50%, -50%) rotate(-90deg); }
      .rotate-right .preview-game { transform: translate(-50%, -50%) rotate(-270deg); }

      .back-button { margin-top: 18px; border: 0; padding: 10px 18px; color: #cbbfc3; background: transparent; cursor: pointer; }
      .back-button:hover, .back-button:focus-visible { color: #fff; outline: none; text-decoration: underline; }

      #game-frame { position: fixed; display: block; border: 0; background: #231f20; }
      #game-frame.pc { inset: 0; width: 100%; height: 100%; }
      #game-frame.mobile {
        top: 50%;
        left: 50%;
        width: min(100vh, calc(100vw * 16 / 9));
        height: min(100vw, calc(100vh * 9 / 16));
        transform-origin: center;
      }
      #game-frame.rotate-left { transform: translate(-50%, -50%) rotate(-90deg); }
      #game-frame.rotate-right { transform: translate(-50%, -50%) rotate(-270deg); }

      @media (max-width: 520px) {
        .choices { gap: 10px; }
        .choice { padding: 16px 9px; }
        .orientation-choice { min-height: 260px; }
        .phone-preview { transform: scale(0.9); margin-bottom: 5px; }
      }
    </style>
  </head>
  <body>
    <main id="launcher">
      <section id="device-step" class="panel" aria-labelledby="device-title">
        <h1>HamDefense</h1>
        <h2 id="device-title">플레이할 기기를 선택하세요</h2>
        <div class="choices">
          <button id="start-pc" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true">🖥️</span>
            <span class="choice-title">PC 버전</span>
            <span class="choice-note">회전 없이 시작</span>
          </button>
          <button id="choose-mobile" class="choice" type="button">
            <span class="choice-icon" aria-hidden="true">📱</span>
            <span class="choice-title">모바일 버전</span>
            <span class="choice-note">화면 방향 선택</span>
          </button>
        </div>
      </section>

      <section id="mobile-step" class="panel" aria-labelledby="orientation-title" hidden>
        <h1>HamDefense</h1>
        <h2 id="orientation-title">편한 회전 방향을 선택하세요</h2>
        <div class="choices">
          <button class="choice orientation-choice rotate-left" type="button" data-rotation="rotate-left">
            <span class="phone-preview" aria-hidden="true"><span class="preview-game">HAM DEFENSE</span></span>
            <span class="choice-title">-90°</span>
            <span class="choice-note">왼쪽으로 회전</span>
          </button>
          <button class="choice orientation-choice rotate-right" type="button" data-rotation="rotate-right">
            <span class="phone-preview" aria-hidden="true"><span class="preview-game">HAM DEFENSE</span></span>
            <span class="choice-title">-270°</span>
            <span class="choice-note">오른쪽으로 회전</span>
          </button>
        </div>
        <button id="back" class="back-button" type="button">← 기기 선택으로 돌아가기</button>
      </section>
    </main>

    <script>
      var launcher = document.querySelector("#launcher");
      var deviceStep = document.querySelector("#device-step");
      var mobileStep = document.querySelector("#mobile-step");

      function startGame(mode, rotation) {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js?v=404-fix-1");
        }
        var frame = document.createElement("iframe");
        frame.id = "game-frame";
        frame.className = mode + (rotation ? " " + rotation : "");
        frame.src = "game.html?v=404-fix-1";
        frame.title = "HamDefense";
        frame.allow = "fullscreen";
        frame.allowFullscreen = true;
        document.body.appendChild(frame);
        launcher.hidden = true;
      }

      document.querySelector("#start-pc").addEventListener("click", function () { startGame("pc"); });
      document.querySelector("#choose-mobile").addEventListener("click", function () {
        deviceStep.hidden = true;
        mobileStep.hidden = false;
      });
      document.querySelector("#back").addEventListener("click", function () {
        mobileStep.hidden = true;
        deviceStep.hidden = false;
        document.querySelector("#choose-mobile").focus();
      });
      document.querySelectorAll("[data-rotation]").forEach(function (button) {
        button.addEventListener("click", function () { startGame("mobile", button.dataset.rotation); });
      });

    </script>
  </body>
</html>
