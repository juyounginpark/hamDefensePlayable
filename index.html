<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>HamDefense</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231f20;
      }

      #game-frame {
        position: fixed;
        top: 50%;
        left: 50%;
        display: block;
        width: min(100vh, calc(100vw * 16 / 9));
        height: min(100vw, calc(100vh * 9 / 16));
        border: 0;
        transform: translate(-50%, -50%) rotate(-90deg);
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <!-- Keep Unity's rendering context at 16:9 and rotate only its outer frame. -->
    <iframe
      id="game-frame"
      src="game.html"
      title="HamDefense"
      allow="fullscreen"
      allowfullscreen
    ></iframe>
  </body>
</html>
