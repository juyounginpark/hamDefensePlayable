<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>HamDefense Game</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body, #unity-container, #unity-canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231f20;
      }

      #unity-container {
        position: fixed;
        inset: 0;
      }

      #unity-canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        var item = document.createElement("div");
        item.textContent = message;
        item.style.cssText = type === "error"
          ? "background:red;padding:10px"
          : "background:yellow;padding:10px";
        warningBanner.appendChild(item);
        warningBanner.style.display = "block";
        if (type !== "error") {
          setTimeout(function () {
            item.remove();
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/HamDefense.data.unityweb",
        frameworkUrl: buildUrl + "/HamDefense.framework.js.unityweb",
        codeUrl: buildUrl + "/HamDefense.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "hamdefense",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1
      };

      loadingBar.style.display = "block";
      var loader = document.createElement("script");
      loader.src = buildUrl + "/HamDefense.loader.js";
      loader.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (progress * 100) + "%";
        }).then(function () {
          loadingBar.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
