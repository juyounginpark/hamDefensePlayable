<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>HamDefense Game</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #231f20;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        aspect-ratio: 16 / 9;
        background: #231f20;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
    <script src="Build/HamDefense.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/HamDefense.data",
        frameworkUrl: "Build/HamDefense.framework.js",
        codeUrl: "Build/HamDefense.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "hamdefense",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
